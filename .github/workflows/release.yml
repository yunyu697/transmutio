name: Release（CI 出包，三平台）

# 唯一发布路径：推送 v* 标签即由 CI 构建三平台安装包、生成 SHA256SUMS 并创建 Release。
# 不再手工上传同名附件（手工 Release 与工作流并存会出现两个 Release 或附件被覆盖）。
# 安装包不包含 FFmpeg / Poppler 二进制；正文必须如实写「未签名」。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本闸门：tag 必须等于版本文件，段位 ≤10，alpha 序号单调递增且不带前导零。
  guard:
    runs-on: ubuntu-latest
    steps:
      # alpha 序号要跟历史 tag 比较，必须取全量 tag（默认浅克隆拿不到）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 版本规则自测（反例必须被拦）
        run: node scripts/version-rules-test.mjs
      - name: tag 与版本文件一致
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: matrix.platform != 'macos'
        with:
          workspaces: src-tauri -> target
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - name: 构建 LGPL 变体
        run: npm run build:lgpl
      - name: 构建 GPL 变体
        run: npm run build:gpl
      - name: 校验产物 --version 与 tag 一致
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows) BIN="src-tauri/target/release/Transmutio.exe"; GBIN="src-tauri/target/release/Transmutio GPL.exe" ;;
            *) BIN="src-tauri/target/release/Transmutio"; GBIN="src-tauri/target/release/Transmutio GPL" ;;
          esac
          node scripts/check-version.mjs --tag "$GITHUB_REF_NAME" --skip-alpha-sequence --binary "$BIN"
          node scripts/check-version.mjs --tag "$GITHUB_REF_NAME" --skip-alpha-sequence --binary "$GBIN"
      - name: 生成 SHA256SUMS
        run: node scripts/release-checksums.mjs
      - name: 上传本平台产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            dist-artifacts/lgpl/*
            dist-artifacts/gpl/*
            dist-artifacts/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: 合并三平台 SHA256SUMS（文件名按 GitHub 资产名归一）
        run: node scripts/release-checksums.mjs --flat dist-release --normalize-names dist-release/SHA256SUMS
      - name: 确认本版本 Release 说明存在
        run: test -f "release-notes/${GITHUB_REF_NAME}.md" || { echo "缺少 release-notes/${GITHUB_REF_NAME}.md"; exit 1; }
      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') }}
          name: Transmutio ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            dist-release/*.msi
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.deb
            dist-release/*.AppImage
            dist-release/SHA256SUMS
          fail_on_unmatched_files: true
