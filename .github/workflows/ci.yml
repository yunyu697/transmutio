name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端：类型检查、生产构建、不依赖真实 FFmpeg 的静态断言
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 类型检查 + 生产构建
        run: npm run build
      - name: 格式清单静态断言（容器 ≥4 / 音频 ≥5 / 不兼容组合 / 探测提示）
        run: npm run verify:formats
      - name: 版本规则自测（0.11.0 / alpha0 / alpha01 / tag 与产物不一致等反例必须被拦）
        run: npm run version:test
      - name: 版本一致性（package.json / tauri.conf.json / Cargo.toml）
        # main 上的浅克隆没有历史 tag，alpha 单调性交给 release 工作流（fetch-depth: 0）校验。
        run: npm run version:check -- --skip-alpha-sequence

  # 无损检查：cargo fmt / clippy / 单测
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 安装 Tauri v2 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev ffmpeg
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: 格式检查（失败即修，不绕过）
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy（仅暴露警告，不阻断）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features dev-tools
      - name: 单元测试（124 条：容器矩阵 / 变速 / 水印 / 字幕 / 图片压缩 / 音量 / 分割 / GIF 等）
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: 无窗口真实转码（Linux 实跑：真实 ffmpeg + 真实文件系统，不启窗口）
        run: |
          ffmpeg -version | head -1
          cargo run --manifest-path src-tauri/Cargo.toml --features dev-tools --bin headless-check -- samples/core-e2e-linux.json
      - name: 上传无窗口转码报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-e2e-linux-report
          path: samples/core-e2e-linux.json

  # 无头 UI：面板持久化 + 旧前缀不读取（需要浏览器，不需要 FFmpeg）
  ui-headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 面板持久化 / 旧前缀不读取（headless，无可见窗口）
        run: node scripts/panel-persist-check.mjs

  # 依赖真实 FFmpeg / Poppler 的用例（verify:core / p2-check / flavor 真实转码）
  # 依赖本机或自托管 runner 上的 FFmpeg 与 Poppler，GitHub 默认 runner 不执行。
