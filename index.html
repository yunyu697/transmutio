<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transmutio</title>
    <style>
      /* 首帧底色：WebView2 默认白底，JS/CSS 还没加载时会先闪一下白。
         这里用内联样式先把窗口底色铺满，再由下面的内联脚本按已保存主题改成浅色。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0e14;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #edf1f6;
      }
    </style>
    <script>
      // 在首帧之前读出已保存的主题，避免「深色底 → 浅色界面」的跳变。
      (function () {
        try {
          var raw = localStorage.getItem("transmutio:settings");
          var data = raw ? JSON.parse(raw).data || {} : {};
          var light = data.theme === "light";
          if (light) document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = light ? "light" : "dark";
        } catch (error) {
          /* 读不到设置就按默认深色渲染，不影响启动 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
